name: Windows Haxball App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-154.0.28-g564dd6c-chromium-154.0.8037.58-windows64

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DHAX_BUILD_APP=ON
          -DHAX_BUILD_TESTS=ON
          -DHAX_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test core
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Parse PowerShell tooling
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content $_.FullName -Raw))
            Write-Host "Parsed $($_.Name)"
          }

      - name: Verify application payload
        shell: pwsh
        run: |
          $required = @(
            "build/Release/Haxball App.exe",
            "build/Release/hax_system_probe.exe",
            "build/Release/hax_capture_analyzer.exe",
            "build/Release/hax_input_pulse.exe",
            "build/Release/benchmark.html",
            "build/Release/libcef.dll"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Expected application payload was not produced: $path"
            }
          }

      - name: Verify Haxball App branding
        shell: pwsh
        run: |
          $version = (Get-Item "build/Release/Haxball App.exe").VersionInfo
          if ($version.ProductName -ne "Haxball App") {
            throw "Unexpected ProductName: $($version.ProductName)"
          }
          if ($version.FileDescription -ne "Haxball App") {
            throw "Unexpected FileDescription: $($version.FileDescription)"
          }
          Write-Host "Haxball App branding metadata verified."

      - name: Verify deterministic hardware fingerprint
        shell: pwsh
        run: |
          $probe = "build/Release/hax_system_probe.exe"
          $a = & "scripts/hardware-fingerprint.ps1" -ProbeExecutable $probe
          $b = & "scripts/hardware-fingerprint.ps1" -ProbeExecutable $probe
          if ($a -ne $b) {
            throw "Hardware fingerprint is not deterministic."
          }
          if ($a -notmatch '^[0-9a-f]{64}$') {
            throw "Unexpected fingerprint format: $a"
          }
          Write-Host "Fingerprint smoke test passed: $a"

      - name: Package Windows x64 runtime
        shell: pwsh
        run: |
          $stage = "dist/Haxball App"
          $bin = Join-Path $stage "bin"
          $scripts = Join-Path $stage "scripts"
          $docs = Join-Path $stage "docs"
          New-Item -ItemType Directory -Force -Path $bin,$scripts,$docs | Out-Null

          Copy-Item "build/Release/*" $bin -Recurse -Force
          Remove-Item "$bin/*.pdb" -Force -ErrorAction SilentlyContinue
          Remove-Item "$bin/hax_core_tests.exe" -Force -ErrorAction SilentlyContinue
          Remove-Item "$bin/hax_optimizer_bench.exe" -Force -ErrorAction SilentlyContinue

          Copy-Item "scripts/calibrate.ps1" $scripts
          Copy-Item "scripts/ensure-presentmon.ps1" $scripts
          Copy-Item "scripts/hardware-fingerprint.ps1" $scripts
          Copy-Item "scripts/install.ps1" $scripts
          Copy-Item "scripts/run.ps1" $scripts
          Copy-Item "docs/*" $docs
          Copy-Item "Install Haxball App.cmd" $stage
          Copy-Item "README.md","LICENSE","THIRD_PARTY_NOTICES.md" $stage
          if (Test-Path "SECURITY.md") {
            Copy-Item "SECURITY.md" $stage
          }

          Compress-Archive -Path "$stage/*" -DestinationPath "dist/Haxball-App-Windows-x64.zip" -Force

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haxball-App-Windows-x64
          path: dist/Haxball-App-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable direct-download release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          }

          gh release create latest `
            "dist/Haxball-App-Windows-x64.zip#Haxball App - Windows x64" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Haxball App - Latest" `
            --notes "Latest verified Windows x64 build of Haxball App. Extract the ZIP and run Install Haxball App.cmd."
